<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Practice one-point perspective, light, and painting values with interactive floating cubes.">
  <title>Perspective &amp; light · Zuko</title>
  <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="./studio.css">
  <script src="./studio.js" defer></script>
</head>
<body>
  <main id="perspective-light-studio">
    <header class="studio-header"><a href="/art/">Back to Art</a><h1>Perspective &amp; light</h1></header>
    <div class="move-controls" role="group" aria-label="Choose what to move">
      <button type="button" data-move="light" aria-pressed="true">Move light</button>
      <button type="button" data-move="vp" aria-pressed="false">Move vanishing point</button>
    </div>
    <p class="hint" id="move-hint">Click or tap the scene to place the light. You can also drag either handle.</p>
    <div class="light-controls">
      <label class="slider-field"><span>Light depth <output data-output="depth" for="light-depth"></output></span><input id="light-depth" type="range" min="1" max="12" step="0.1" value="3" data-control="depth" aria-label="Light depth"><span class="range-ends"><span>Near you</span><span>Behind cubes</span></span></label>
      <label class="slider-field"><span>Fill light <output data-output="ambient" for="fill-light"></output></span><input id="fill-light" type="range" min="0" max="0.65" step="0.01" value="0.16" data-control="ambient" aria-label="Fill light"><span class="range-ends"><span>Hard shadows</span><span>Softer shadows</span></span></label>
    </div>
    <div class="ps-stage" aria-describedby="move-hint">
      <svg class="ps-scene" role="img" aria-label="Six floating cubes in one-point perspective, shaded by the movable light"></svg>
      <button type="button" class="point-handle" data-handle="vp" aria-label="Vanishing point handle. Drag or use arrow keys; Shift moves faster.">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="7"/><path d="M12 2v5m0 10v5M2 12h5m10 0h5"/></svg>
      </button>
      <button type="button" class="point-handle light-handle" data-handle="light" aria-label="Light handle. Drag or use arrow keys; Shift moves faster.">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 1v3m0 16v3M1 12h3m16 0h3M4 4l2 2m12 12 2 2M4 20l2-2M18 6l2-2"/></svg>
      </button>
    </div>
    <div class="material-controls">
      <label class="color-field">Cube color <input type="color" data-control="color" value="#b4826e" aria-label="Cube color"></label>
      <label><input type="checkbox" data-control="gray"> Grayscale</label>
      <label><input type="checkbox" data-control="guides" checked> Perspective guides</label>
    </div>
    <div class="ps-values"></div>
    <p class="note">Flat matte lighting, without cast shadows. Settings stay in this browser.</p>
    <p class="sr-only" data-status aria-live="polite"></p>
    <noscript><p>Enable JavaScript to use the light and perspective controls.</p></noscript>
  </main>
</body>
</html>
