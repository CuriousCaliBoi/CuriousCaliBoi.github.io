pokemon:
  title: Pokemon Red
  url: /pokemon/
  embed_url: /pokemon/
  description: Watch the model choose its next move in the live game viewer.
  mode: Live viewer
  note: The model controls the game. Visitor input does not send moves to the emulator.
smallville:
  title: A day in Smallville
  url: /smallville/
  embed_url: /smallville/
  description: Follow an agent, inspect its memories, and explore the town as its day unfolds.
  mode: Interactive viewer
  note: Drag to pan, scroll to zoom, or choose an agent’s Follow or Mind button. These controls explore the running simulation without changing its decisions.
jaz-traces:
  title: JAZ trace viewer
  url: /traces/
  embed_url: /traces/
  description: Inspect the Python cells, REPL results, retries, nested agents, token counts, and final values from JAZ runs on my DGX Spark.
  mode: Private live viewer
  note: The trace feed stays on my private Tailscale network. It loads only on my connected devices; the public site never stores the trace files.
minimax-h3:
  title: MiniMax-H3 studio
  url: /h3/
  embed_url: /h3/
  description: Write a scene, choose a seed, and render a short video on my DGX Spark.
  mode: Private video generator
  note: The generator is available only on my private Tailscale network. Prompts and videos travel directly between this browser and the Spark; the public site does not store them.
stardew:
  title: Stardew Valley
  url: /stardew/
  embed_url: /stardew/
  description: Watch a local model develop its farm, explore the valley, and attempt StarDojo Lite tasks.
  mode: Live viewer
  note: The notebook follows the active runner. Pausing this feed only pauses your view; the agent keeps playing. Gameplay is streamed as 60 fps video without audio, with a short live delay.
world-models:
  title: World Models Lab
  url: /experiments/world-models/
  embed_url: /experiments/world-models/
  description: Step through a Craftax life, watch learning curves unfold, and discover why the first model lost to predicting that nothing changes.
  mode: Interactive field lab
  note: The observed rollout, step-by-step trace, metrics, seeds, and fingerprints are public. Training data and checkpoints remain on the Spark.
world-models-carracing:
  title: World Models, CarRacing dream
  url: /world-models-carracing/
  embed_url: /world-models-carracing/
  description: Drive inside a 2018-style world model trained on my DGX Spark. The VAE, MDN-RNN, and CMA-ES controller from the original paper run entirely in your browser.
  mode: In-browser world model
  note: The models are static files that run locally in your browser; nothing contacts the Spark. Arrow keys or the on-screen pad take the wheel from the agent, and the temperature slider changes how boldly the model samples its own predictions.
dreamerv3:
  title: DreamerV3, a small world
  url: /dreamerv3/
  embed_url: /dreamerv3/
  description: Try balancing a pole, replay an actual DreamerV3 checkpoint, and compare its actions with a random baseline from the same starting seeds.
  mode: Playground and recorded evaluations
  note: The playground runs physics in your browser. Model runs were recorded on the Spark; the page does not run DreamerV3 inference or train a model. All eight evaluation episodes are included.
