<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#0a0b0d">
  <meta name="description" content="A private neuron and circuit explorer for Qwen3.5-4B running on a DGX Spark.">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; frame-src https://spark-a4b4.tailef40b0.ts.net:8448; style-src 'unsafe-inline'; base-uri 'none'; form-action 'none'; object-src 'none'">
  <title>Neuron Explorer | Zuko's Blog</title>
  <style>
    :root {
      --bg: #08090b;
      --panel: rgba(13, 15, 18, 0.94);
      --surface: #101216;
      --line: rgba(255, 255, 255, 0.11);
      --line-bright: rgba(255, 210, 122, 0.24);
      --text: #f4f2ec;
      --muted: #9d9b94;
      --gold: #ffd27a;
      --blue: #72a9d8;
      --font: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    }

    * { box-sizing: border-box; }

    html,
    body {
      width: 100%;
      min-width: 320px;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: var(--bg);
      color: var(--text);
      font-family: var(--font);
    }

    body {
      display: grid;
      grid-template-rows: auto minmax(0, 1fr);
      background:
        radial-gradient(circle at 8% -12%, rgba(255, 210, 122, 0.14), transparent 34rem),
        radial-gradient(circle at 102% 2%, rgba(114, 169, 216, 0.11), transparent 31rem),
        linear-gradient(rgba(255, 255, 255, 0.018) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255, 255, 255, 0.018) 1px, transparent 1px),
        var(--bg);
      background-size: auto, auto, 32px 32px, 32px 32px, auto;
    }

    .skip-link {
      position: fixed;
      top: -5rem;
      left: 1rem;
      z-index: 10;
      padding: 0.65rem 0.9rem;
      border: 1px solid var(--gold);
      background: var(--bg);
      color: var(--text);
    }

    .skip-link:focus { top: 1rem; }

    .topbar {
      position: relative;
      z-index: 1;
      display: flex;
      min-height: 68px;
      align-items: center;
      gap: 18px;
      padding: 11px clamp(14px, 2.5vw, 34px);
      border-bottom: 1px solid var(--line);
      background: var(--panel);
      backdrop-filter: blur(18px);
    }

    .back {
      flex: 0 0 auto;
      color: var(--muted);
      font-size: 0.82rem;
      text-decoration: none;
      transition: color 140ms ease;
    }

    .back:hover,
    .back:focus-visible { color: var(--text); }

    .divider {
      width: 1px;
      height: 28px;
      flex: 0 0 auto;
      background: var(--line);
    }

    .identity {
      display: flex;
      min-width: 0;
      align-items: center;
      gap: 11px;
    }

    .mark {
      position: relative;
      display: grid;
      width: 36px;
      height: 36px;
      flex: 0 0 auto;
      place-items: center;
      overflow: hidden;
      border: 1px solid var(--line-bright);
      border-radius: 9px;
      background: #151515;
      box-shadow: 0 0 30px rgba(255, 210, 122, 0.13);
      color: var(--gold);
      font: 750 0.68rem/1 var(--mono);
      letter-spacing: -0.04em;
    }

    .mark::before,
    .mark::after {
      position: absolute;
      width: 4px;
      height: 4px;
      border-radius: 50%;
      background: currentColor;
      box-shadow: 9px 6px 0 rgba(114, 169, 216, 0.8), -7px 8px 0 rgba(255, 210, 122, 0.55);
      content: "";
      opacity: 0.65;
    }

    .mark::before { top: 6px; left: 7px; }
    .mark::after { right: 7px; bottom: 7px; transform: rotate(180deg); }

    .mark span { position: relative; z-index: 1; }

    .title-group { min-width: 0; }

    h1 {
      margin: 0;
      overflow: hidden;
      font-size: clamp(1rem, 2.1vw, 1.24rem);
      font-weight: 680;
      letter-spacing: -0.025em;
      line-height: 1.2;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .subtitle {
      margin: 3px 0 0;
      overflow: hidden;
      color: var(--muted);
      font: 0.65rem/1.35 var(--mono);
      letter-spacing: 0.045em;
      text-overflow: ellipsis;
      text-transform: uppercase;
      white-space: nowrap;
    }

    .badges {
      display: flex;
      margin-left: auto;
      flex: 0 0 auto;
      align-items: center;
      gap: 8px;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 6px 10px;
      border: 1px solid var(--line);
      border-radius: 999px;
      color: var(--muted);
      font: 0.64rem/1.3 var(--mono);
      letter-spacing: 0.045em;
      text-transform: uppercase;
      white-space: nowrap;
    }

    .badge--private { color: var(--gold); }

    .dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--gold);
      box-shadow: 0 0 0 4px rgba(255, 210, 122, 0.09), 0 0 13px rgba(255, 210, 122, 0.45);
    }

    .viewer-shell {
      position: relative;
      min-width: 0;
      min-height: 0;
      margin: clamp(8px, 1.5vw, 18px);
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: clamp(10px, 1.4vw, 16px);
      background: var(--surface);
      box-shadow: 0 24px 70px rgba(0, 0, 0, 0.48);
    }

    .offline-note {
      position: absolute;
      inset: 0;
      display: grid;
      place-content: center;
      gap: 0.65rem;
      padding: 24px;
      text-align: center;
    }

    .offline-note strong {
      color: var(--text);
      font-size: clamp(1rem, 2vw, 1.2rem);
      font-weight: 620;
    }

    .offline-note span {
      max-width: 38rem;
      color: var(--muted);
      font: 0.73rem/1.6 var(--mono);
      letter-spacing: 0.025em;
    }

    iframe {
      position: relative;
      display: block;
      width: 100%;
      height: 100%;
      border: 0;
      background: transparent;
    }

    @media (max-width: 680px) {
      .topbar { min-height: 60px; gap: 10px; }
      .divider, .badge--source { display: none; }
      .back { font-size: 0; }
      .back::before { content: "\2190"; font-size: 1.15rem; }
      .mark { width: 32px; height: 32px; }
      .viewer-shell { margin: 6px; border-radius: 9px; }
    }

    @media (max-width: 430px) {
      .subtitle { display: none; }
      .badge { padding: 5px 8px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; transition: none !important; }
    }
  </style>
</head>
<body>
  <a class="skip-link" href="#explorer">Skip to explorer</a>

  <header class="topbar">
    <a class="back" href="/experiments/" aria-label="Back to experiments">&larr; Experiments</a>
    <span class="divider" aria-hidden="true"></span>
    <div class="identity">
      <span class="mark" aria-hidden="true"><span>N/</span></span>
      <div class="title-group">
        <h1>Neuron Explorer</h1>
        <p class="subtitle">Qwen3.5-4B · steering, activations and circuits</p>
      </div>
    </div>
    <div class="badges" aria-label="Explorer status">
      <span class="badge badge--source">DGX Spark</span>
      <span class="badge badge--private"><span class="dot" aria-hidden="true"></span>Private</span>
    </div>
  </header>

  <main class="viewer-shell" id="explorer" aria-label="Private Neuron Explorer">
    <div class="offline-note" aria-hidden="true">
      <strong>The explorer lives on the Spark.</strong>
      <span>Connect this device to Tailscale to inspect Qwen neurons, lenses and live activations.</span>
    </div>
    <iframe
      src="https://spark-a4b4.tailef40b0.ts.net:8448/"
      title="Private Qwen Neuron Explorer on the DGX Spark"
      loading="eager"
      referrerpolicy="no-referrer"
      allow="local-network-access; local-network; loopback-network"
      sandbox="allow-scripts allow-same-origin allow-downloads allow-forms">
    </iframe>
  </main>
</body>
</html>
