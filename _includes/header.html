<header class="site-header">
  <div class="header-inner">
    <a class="site-name" href="{{ '/' | relative_url }}"><span class="site-mark" aria-hidden="true">z.</span>{{ site.title | escape }}</a>
    <nav class="site-nav" aria-label="Main navigation">
      {% for item in site.data.navigation.main %}
      <a href="{{ item.url | relative_url }}"{% if page.url == item.url %} aria-current="page"{% elsif item.url == '/' and page.layout == 'post' %} aria-current="page"{% elsif item.url == '/models/' and page.url contains '/models/' %} aria-current="page"{% endif %}>{{ item.title }}</a>
      {% endfor %}
    </nav>
  </div>
</header>
