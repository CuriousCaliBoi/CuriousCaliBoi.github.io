<section class="model-guide__sources" aria-labelledby="primary-sources-title">
  <div class="model-guide__section-heading">
    <h2 id="primary-sources-title">Primary sources</h2>
  </div>
  <ul>
    {% for source in page.guide_sources %}
    <li>
      <a href="{{ source.url }}">{{ source.label }} <span aria-hidden="true">&nearr;</span></a>
      {% if source.note %}<span>{{ source.note }}</span>{% endif %}
    </li>
    {% endfor %}
  </ul>
  <p class="model-guide__source-method">Diagrams simplify the computation. See the linked papers and implementations for exact details.</p>
</section>
