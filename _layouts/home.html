---
layout: default
---
<div class="journal-home">
  <header class="home-intro"><h1>Writing</h1></header>
  <div class="writing-list">
    {% for post in site.posts %}
    <article class="writing-entry">
      <time datetime="{{ post.date | date_to_xmlschema }}">{% assign post_date_format = post.date_format | default: '%b %-d, %Y' %}{{ post.date | date: post_date_format }}</time>
      <h2><a href="{{ post.url | relative_url }}">{{ post.title | escape }}</a></h2>
    </article>
    {% endfor %}
  </div>
  {{ content }}
</div>
