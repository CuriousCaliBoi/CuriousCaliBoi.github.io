<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#0c0f17">
  <meta name="description" content="A private, live viewer for JAZ agent traces generated on a DGX Spark.">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; frame-src https://spark-a4b4.tailef40b0.ts.net:8443; style-src 'unsafe-inline'; base-uri 'none'; form-action 'none'">
  <title>JAZ traces | Zuko's Blog</title>
  <style>
    :root {
      --bg: #090b11;
      --panel: rgba(15, 18, 28, 0.94);
      --surface: #111522;
      --line: rgba(255, 255, 255, 0.11);
      --text: #f4f6fb;
      --muted: #9ca7ba;
      --violet: #7c6df2;
      --cyan: #56c7e8;
      --font: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    }

    * { box-sizing: border-box; }

    html,
    body {
      width: 100%;
      min-width: 320px;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: var(--bg);
      color: var(--text);
      font-family: var(--font);
    }

    body {
      display: grid;
      grid-template-rows: auto minmax(0, 1fr);
      background:
        radial-gradient(circle at 8% -10%, rgba(124, 109, 242, 0.19), transparent 34rem),
        radial-gradient(circle at 100% 0%, rgba(86, 199, 232, 0.12), transparent 31rem),
        var(--bg);
    }

    .topbar {
      position: relative;
      z-index: 1;
      display: flex;
      min-height: 68px;
      align-items: center;
      gap: 18px;
      padding: 11px clamp(14px, 2.5vw, 34px);
      border-bottom: 1px solid var(--line);
      background: var(--panel);
      backdrop-filter: blur(18px);
    }

    .back {
      flex: 0 0 auto;
      color: var(--muted);
      font-size: 0.82rem;
      text-decoration: none;
      transition: color 140ms ease;
    }

    .back:hover,
    .back:focus-visible { color: var(--text); }

    .divider {
      width: 1px;
      height: 28px;
      flex: 0 0 auto;
      background: var(--line);
    }

    .identity {
      display: flex;
      min-width: 0;
      align-items: center;
      gap: 11px;
    }

    .mark {
      display: grid;
      width: 34px;
      height: 34px;
      flex: 0 0 auto;
      place-items: center;
      border: 1px solid rgba(255, 255, 255, 0.18);
      border-radius: 10px;
      background: linear-gradient(145deg, var(--violet), #5647c8);
      box-shadow: 0 0 28px rgba(124, 109, 242, 0.27);
      color: white;
      font-family: var(--mono);
      font-size: 0.72rem;
      font-weight: 800;
      letter-spacing: -0.06em;
    }

    .title-group { min-width: 0; }

    h1 {
      margin: 0;
      overflow: hidden;
      font-size: clamp(1rem, 2.1vw, 1.24rem);
      font-weight: 680;
      letter-spacing: -0.025em;
      line-height: 1.2;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .subtitle {
      margin: 3px 0 0;
      overflow: hidden;
      color: var(--muted);
      font-family: var(--mono);
      font-size: 0.65rem;
      letter-spacing: 0.045em;
      text-overflow: ellipsis;
      text-transform: uppercase;
      white-space: nowrap;
    }

    .badges {
      display: flex;
      margin-left: auto;
      flex: 0 0 auto;
      align-items: center;
      gap: 8px;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 6px 10px;
      border: 1px solid var(--line);
      border-radius: 999px;
      color: var(--muted);
      font-family: var(--mono);
      font-size: 0.64rem;
      letter-spacing: 0.045em;
      text-transform: uppercase;
      white-space: nowrap;
    }

    .badge--private { color: #c6bdff; }

    .dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--violet);
      box-shadow: 0 0 0 4px rgba(124, 109, 242, 0.11), 0 0 13px rgba(124, 109, 242, 0.55);
    }

    .viewer-shell {
      position: relative;
      min-width: 0;
      min-height: 0;
      margin: clamp(8px, 1.5vw, 18px);
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: clamp(10px, 1.4vw, 16px);
      background: var(--surface);
      box-shadow: 0 24px 70px rgba(0, 0, 0, 0.43);
    }

    .viewer-shell::before {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      padding: 24px;
      color: var(--muted);
      content: "Connect this device to Tailscale to load Spark traces.";
      font-family: var(--mono);
      font-size: 0.75rem;
      letter-spacing: 0.035em;
      text-align: center;
    }

    iframe {
      position: relative;
      display: block;
      width: 100%;
      height: 100%;
      border: 0;
      background: transparent;
    }

    @media (max-width: 680px) {
      .topbar { min-height: 60px; gap: 10px; }
      .divider, .badge--source { display: none; }
      .back { font-size: 0; }
      .back::before { content: "\2190"; font-size: 1.15rem; }
      .mark { width: 30px; height: 30px; }
      .viewer-shell { margin: 6px; border-radius: 9px; }
    }

    @media (max-width: 430px) {
      .subtitle { display: none; }
      .badge { padding: 5px 8px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; transition: none !important; }
    }
  </style>
</head>
<body>
  <header class="topbar">
    <a class="back" href="/projects/" aria-label="Back to projects">&larr; Projects</a>
    <span class="divider" aria-hidden="true"></span>
    <div class="identity">
      <span class="mark" aria-hidden="true">J/</span>
      <div class="title-group">
        <h1>JAZ trace viewer</h1>
        <p class="subtitle">Python cells, REPL results and agent paths</p>
      </div>
    </div>
    <div class="badges" aria-label="Viewer status">
      <span class="badge badge--source">DGX Spark</span>
      <span class="badge badge--private"><span class="dot" aria-hidden="true"></span>Private</span>
    </div>
  </header>

  <main class="viewer-shell">
    <iframe
      src="https://spark-a4b4.tailef40b0.ts.net:8443/"
      title="Private JAZ trace viewer on Spark"
      loading="eager"
      referrerpolicy="no-referrer"
      allow="local-network-access; local-network; loopback-network"
      sandbox="allow-scripts allow-same-origin allow-downloads">
    </iframe>
  </main>
</body>
</html>
