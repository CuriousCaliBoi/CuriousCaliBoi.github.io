---
layout: page
title: Experiments
permalink: /experiments/
---
<div class="experiment-library">
  {% for item in site.data.experiments %}
    {% assign experiment = item[1] %}
    <article>
      <h2><a href="{{ experiment.url | relative_url }}">{{ experiment.title | escape }}</a></h2>
      <p>{{ experiment.description }}</p>
      <p class="experiment-library-meta">{{ experiment.mode }}</p>
    </article>
  {% endfor %}
</div>
