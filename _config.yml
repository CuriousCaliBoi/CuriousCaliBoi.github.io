title: Zuko's Blog
description: Exploring code, mathematics, and digital consciousness
github_username: CuriousCaliBoi

# Email and twitter are optional:
email: rs6121@nyu.edu  
twitter_username:

# Set this to true to get LaTeX math equation support
use_math: true

# Add your Google Analytics ID here if you have one and want to use it
google_analytics:

# Set baseurl to an empty string if your site is at the root (recommended for GitHub Pages)
baseurl: ""
url: "https://curiouscaliboi.github.io"

header_pages:
  - index.md
  - projects.md
  - models.html
  - about.md

# Site metadata and GitHub Pages plugins
author: Zuko
plugins:
  - jekyll-seo-tag
  - jekyll-feed
  - jekyll-gist
  - jekyll-octicons
  - jekyll-github-metadata

titles_from_headings:
  enabled: true
  strip_title: true
  collections: true

highlighter: rouge
markdown: kramdown
kramdown:
  math_engine: mathjax
  input: GFM
  auto_ids: true
  hard_wrap: false
  syntax_highlighter: rouge

# Exclude specific directories or files if needed (optional)
exclude:
  - .DS_Store
  - node_modules
  - vendor
  - _drafts
  - CLAUDE.md
  - .claude
  - .humanize
  - temp
  - README.md
  - Gemfile
  - Gemfile.lock

# Custom CSS
sass:
  sass_dir: _sass
  style: compressed
