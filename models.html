---
layout: page
title: Models
permalink: /models/
---
<div class="model-list">
  {% for model in site.data.model_guides %}
  <article>
    <h2><a href="{{ model.url | relative_url }}">{{ model.title }}</a></h2>
    <dl>
      {% for fact in model.facts %}
      <div><dt>{{ fact.label }}</dt><dd>{{ fact.value }}</dd></div>
      {% endfor %}
    </dl>
  </article>
  {% endfor %}
</div>
